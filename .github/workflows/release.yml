# Workflow de release mínimo (Tema 24 - contexto adicional).
#
# Este workflow se incluye como contexto pero NO es objeto del Ejercicio 1.
# Se activa con el push de un tag vX.Y.Z y crea una release en GitHub.
#
# No se trabaja en clase porque necesitaría secretos reales (NPM_TOKEN) para
# ser interesante. El alumno avanzado puede mencionarlo en CI-AUDIT.md
# señalando que también lo auditaría por los mismos criterios.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
