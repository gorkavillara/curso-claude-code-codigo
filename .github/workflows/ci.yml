# Workflow inicial del Notebox (Tema 24 - plantado con olores reales).
#
# Este workflow NO está optimizado a propósito. El Ejercicio 1 consiste en
# auditarlo, priorizar olores y aplicar 3 fixes razonados. No edites este
# archivo hasta haber pedido a Claude el diagnóstico inicial.
#
# Olores plantados (no exhaustivo):
# - actions sin pin a SHA (uses: actions/checkout@v3, setup-node@v3).
# - actions/setup-node@v3 ya deprecado, sin cache:.
# - Un único job que mezcla lint + typecheck + test (sin separar, sin needs).
# - Sin bloque permissions: (GITHUB_TOKEN con write por defecto).
# - Sin concurrency: con cancel-in-progress.
# - on: push: branches: '*' permisivo (corre en cualquier rama).
# - runs-on: ubuntu-latest (versión flotante).

name: CI

on:
  push:
    branches:
      - '*'
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build --if-present
